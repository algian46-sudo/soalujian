<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lembar Kerja Siswa: 10 Pixel Art & Tabel Kode (15x15)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body { background: white; -webkit-print-color-adjust: exact; padding: 0; }
            .no-print { display: none; }
            .page-break { page-break-after: always; break-after: page; margin-bottom: 0; }
            .worksheet-card { border: none !important; shadow: none !important; padding: 0 !important; }
        }
        .print-grid {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            width: 270px;
            height: 270px;
            border: 2px solid #000;
        }
        .print-cell {
            border: 1px solid #cbd5e1;
            width: 18px;
            height: 18px;
        }
        .filled { background-color: #000 !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans p-4 md:p-8">

    <!-- Tombol Cetak (Hilang saat diprint) -->
    <div class="max-w-3xl mx-auto mb-6 text-center no-print bg-white p-4 rounded-xl shadow border">
        <h2 class="font-bold text-lg mb-1">🖨️ Siap Cetak: Lembar Kerja & Tabel Penyusunan Kode</h2>
        <p class="text-xs text-slate-500 mb-3">Tiap halaman A4 berisi Gambar Target Pixel Art (15x15) + Tabel Lembar Jawab Perintah Kode.</p>
        <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2 rounded-lg shadow transition text-sm">
            🖨️ Cetak Semua Lembar Kerja (Ctrl + P)
        </button>
    </div>

    <!-- CONTAINER UTAMA -->
    <div id="workbook-container" class="max-w-3xl mx-auto flex flex-col gap-8">
        <!-- JavaScript akan merender 10 halaman otomatis -->
    </div>

    <script>
        const emojiData = [
            {
                title: "1. Senyum Standar (Classic Smile)",
                desc: "Amati pola gambar di bawah, lalu susunlah blok perintah kode pada tabel untuk menggambar ulang emotikon ini!",
                black: [
                    [5,4],[6,4],[10,4],[11,4],
                    [5,5],[6,5],[10,5],[11,5],
                    [4,10],[12,10],
                    [5,11],[6,11],[7,11],[8,11],[9,11],[10,11],[11,11]
                ]
            },
            {
                title: "2. Kacamata Hitam (Cool Emoji)",
                desc: "Gunakan logika perulangan atau perpindahan titik koordinat untuk menggambar kacamata dan senyuman.",
                black: [
                    [3,3],[4,3],[5,3],[6,3],[7,3], [10,3],[11,3],[12,3],[13,3],[14,3],
                    [3,4],[7,4], [10,4],[14,4],
                    [3,5],[4,5],[5,5],[6,5],[7,5], [10,5],[11,5],[12,5],[13,5],[14,5],
                    [7,8],
                    [3,10],[13,10],
                    [4,11],[5,11],[6,11],[7,11],[8,11],[9,11],[10,11],[11,11],[12,11]
                ]
            },
            {
                title: "3. Mata Hati (Heart Eyes Emoji)",
                desc: "Tuliskan baris demi baris instruksi warna blok untuk membuat bentuk kelopak hati dan senyum lebar.",
                black: [
                    [3,2],[4,2],[6,2],[7,2], [10,2],[11,2],[13,2],[14,2],
                    [2,3],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3], [9,3],[10,3],[11,3],[12,3],[13,3],[14,3],
                    [2,4],[3,4],[4,4],[5,4],[6,4],[7,4],[8,4], [9,4],[10,4],[11,4],[12,4],[13,4],[14,4],
                    [3,5],[4,5],[5,5],[6,5],[7,5], [10,5],[11,5],[12,5],[13,5],
                    [4,6],[5,6],[6,6], [11,6],[12,6],[13,6],
                    [5,7], [12,7],
                    [8,9],
                    [2,11],[14,11], [3,12],[13,12],
                    [4,13],[5,13],[6,13],[7,13],[8,13],[9,13],[10,13],[11,13],[12,13]
                ]
            },
            {
                title: "4. Terkejut (Surprised Emoji)",
                desc: "Tuliskan kode perulangan/posisi untuk menggambar mata bulat besar dan mulut ekspresi kaget.",
                black: [
                    [4,3],[5,3], [11,3],[12,3],
                    [3,4],[6,4], [10,4],[13,4],
                    [3,5],[6,5], [10,5],[13,5],
                    [4,6],[5,6], [11,6],[12,6],
                    [7,9],[8,9],[9,9],[10,9],
                    [7,10],[10,10],
                    [7,11],[8,11],[9,11],[10,11]
                ]
            },
            {
                title: "5. Tertawa Lebar (Laughing Emoji)",
                desc: "Lengkapi tabel kode untuk membentuk mata terpejam bahagia dan mulut terbuka lebar.",
                black: [
                    [3,3],[4,3], [12,3],[13,3],
                    [4,4], [12,4],
                    [3,8],[4,8],[5,8],[6,8],[7,8],[8,8],[9,8],[10,8],[11,8],[12,8],[13,8],
                    [3,9],[13,9],
                    [4,10],[5,10],[6,10],[7,10],[8,10],[9,10],[10,10],[11,10],[12,10]
                ]
            },
            {
                title: "6. Kedip Mata (Winking Emoji)",
                desc: "Susun alur algoritma untuk membedakan bentuk mata kiri (kedip) dan mata kanan (terbuka).",
                black: [
                    [4,4],[5,4],[6,4],
                    [10,3],[11,3],[12,3],
                    [10,4],[12,4],
                    [10,5],[11,5],[12,5],
                    [5,10],[6,10],[7,10],[8,10],[9,10],[10,10],[11,10]
                ]
            },
            {
                title: "7. Sedih / Kecewa (Sad Emoji)",
                desc: "Tuliskan urutan langkah untuk membuat mata dan lengkungan cemberut ke arah bawah.",
                black: [
                    [4,4],[5,4], [11,4],[12,4],
                    [5,11],[6,11],[7,11],[8,11],[9,11],[10,11],[11,11],
                    [4,12],[12,12]
                ]
            },
            {
                title: "8. Marah / Kesal (Angry Emoji)",
                desc: "Susun kode perintah untuk membuat alis menukik tajam dan mulut bergelombang.",
                black: [
                    [3,3],[4,4],[5,5], [11,5],[12,4],[13,3],
                    [4,6],[5,6], [11,6],[12,6],
                    [4,11],[5,10],[6,11],[7,10],[8,11],[9,10],[10,11],[11,10],[12,11]
                ]
            },
            {
                title: "9. Kacamata Nerd (Nerd Emoji)",
                desc: "Gunakan perintah perpindahan posisi (GOTO) dan pewarnaan piksel untuk kacamata dan gigi kelinci.",
                black: [
                    [3,3],[4,3],[5,3],[6,3],[7,3], [9,3],[10,3],[11,3],[12,3],[13,3],
                    [3,4],[7,4], [9,4],[13,4],
                    [3,5],[4,5],[5,5],[6,5],[7,5], [9,5],[10,5],[11,5],[12,5],[13,5],
                    [7,4], [8,4],
                    [5,4], [11,4],
                    [7,9],[8,9],[9,9],
                    [7,10],[8,10],[9,10]
                ]
            },
            {
                title: "10. Alien / Unik (Sci-Fi Emoji)",
                desc: "Tuliskan susunan algoritma perintah untuk membuat karakter wajah alien 15x15.",
                black: [
                    [6,2],[7,2],[8,2],[9,2],
                    [4,4],[5,4],[6,4],[7,4], [9,4],[10,4],[11,4],[12,4],
                    [4,5],[5,5],[6,5],[7,5], [9,5],[10,5],[11,5],[12,5],
                    [4,6],[5,6],[6,6],[7,6], [9,6],[10,6],[11,6],[12,6],
                    [7,11],[8,11],[9,11]
                ]
            }
        ];

        const container = document.getElementById('workbook-container');

        emojiData.forEach((item, index) => {
            let pageDiv = document.createElement('div');
            pageDiv.className = "worksheet-card bg-white p-6 rounded-2xl shadow-lg border border-slate-200 flex flex-col justify-between page-break min-h-[900px]";
            
            // Header Identitas
            let headerHTML = `
                <div>
                    <div class="w-full border-b pb-3 mb-3 flex justify-between items-start">
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">${item.title}</h3>
                            <p class="text-xs text-slate-500">${item.desc}</p>
                        </div>
                        <div class="text-right text-xs text-slate-400 font-mono">
                            Grid: 15 x 15 | Hal: ${index + 1}/10
                        </div>
                    </div>

                    <!-- Identitas Siswa -->
                    <div class="w-full grid grid-cols-3 gap-2 bg-slate-50 p-2.5 rounded-lg border text-xs mb-4">
                        <div><strong>Nama:</strong> ........................................</div>
                        <div><strong>Kelas:</strong> ...................</div>
                        <div><strong>Tanggal:</strong> ...................</div>
                    </div>

                    <!-- Area Grid Gambar Target -->
                    <div class="flex justify-center mb-4">
                        <div class="flex flex-col items-center">
                            <span class="text-[10px] font-bold text-slate-400 mb-1">TARGET PIXEL ART</span>
            `;

            // Canvas Grid 15x15
            let gridHTML = `<div class="print-grid">`;
            for (let y = 1; y <= 15; y++) {
                for (let x = 1; x <= 15; x++) {
                    let isBlack = item.black.some(coord => coord[0] === x && coord[1] === y);
                    let cellClass = isBlack ? "print-cell filled" : "print-cell";
                    gridHTML += `<div class="${cellClass}"></div>`;
                }
            }
            gridHTML += `</div></div></div>`;

            // Tabel Isian Kode
            let tableRows = '';
            for(let i = 1; i <= 12; i++) {
                tableRows += `
                    <tr class="border-b border-slate-200 text-xs text-center">
                        <td class="py-1 font-mono text-slate-400">${i}</td>
                        <td class="border-x border-slate-200 py-1"></td>
                        <td class="border-x border-slate-200 py-1"></td>
                        <td class="py-1"></td>
                    </tr>
                `;
            }

            let tableHTML = `
                    <!-- TABEL LEMBAR JAWAB PERINTAH KODE -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-700">📋 Lembar Isian Kode Perintah (Algoritma)</span>
                            <span class="text-[10px] text-slate-400">Pilihan Warna: 🟨 Event | 🟦 Motion | 🟧 Control | 🟩 Action</span>
                        </div>
                        <table class="w-full border-2 border-slate-800 rounded-lg overflow-hidden">
                            <thead>
                                <tr class="bg-slate-800 text-white text-[11px] uppercase tracking-wider">
                                    <th class="py-1.5 px-2 w-10">No</th>
                                    <th class="py-1.5 px-3 w-32 border-x border-slate-600">Kategori Warna</th>
                                    <th class="py-1.5 px-4 border-x border-slate-600">Nama Perintah / Blok</th>
                                    <th class="py-1.5 px-4 w-40">Parameter / Koordinat (X, Y)</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRows}
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Footer Catatan Guru -->
                <div class="mt-4 pt-2 border-t flex justify-between text-xs text-slate-500">
                    <span>Paraf Guru: ..........................</span>
                    <span>Nilai: <strong class="text-sm text-slate-800">_______ / 100</strong></span>
                </div>
            `;

            pageDiv.innerHTML = headerHTML + gridHTML + tableHTML;
            container.appendChild(pageDiv);
        });
    </script>
</body>
</html>
